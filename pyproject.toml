[project]
name = "myrmidons-research"
version = "0.1.0"
description = "Research loops joining MNEMON data with METRON metrics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "myrmidons-metron",
    "duckdb",
    "pandas",
    "pyarrow",
    "jupyter",
    "matplotlib",
]

[tool.uv.sources]
myrmidons-metron = { git = "ssh://git@github.com/achillesbro/METRON.git", tag = "v1.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
